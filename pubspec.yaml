name: hevjin
description: "Hevjin - Partnersuche fuer Eziden"
version: 1.0.4+109

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.3.0
  google_fonts: ^6.1.0
  flutter_card_swiper: ^7.0.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  intl: any
  provider: ^6.1.1
  go_router: ^13.0.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  image: ^4.9.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

# ===== App-Icons (flutter_launcher_icons) =====
# Regenerate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: "launcher_icon"
  min_sdk_android: 23
  # Adaptive icon for Android 8+ : logo on dark orange background
  adaptive_icon_background: "#8B3A0F"
  adaptive_icon_foreground: "assets/images/logo.png"
