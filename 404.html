<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hevjin - Partnersuche fuer Eziden">

  <!-- Standalone/PWA-Modus ist ABSICHTLICH deaktiviert (manifest display: browser).
       Die Homescreen-Variante hatte eigenen Speicher (User ausgeloggt), kaputten
       Google-Redirect und Service-Worker-Probleme. Der Weg zur "echten" App ist
       die native Android-App aus dem Play Store.
       Zum Reaktivieren: display: "standalone" im manifest.json + die beiden
       *-web-app-capable Metas hier wieder ergaenzen. -->

  <meta name="apple-mobile-web-app-title" content="Hevj&#238;n">
  <meta name="theme-color" content="#2D2016">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hevj&#238;n</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    // Keep hash for Supabase to process on app start
    // Don't clear it - let supabase_flutter handle the OAuth redirect
  </script>
</head>
<body>
  <script>
    // Cache-Reset EINMAL pro Build, danach ein Reload.
    //
    // Historie (nicht wieder kaputt machen):
    //   - Frueher lief das bei JEDEM Start -> SW+Cache weg -> App laedt alles neu.
    //   - Dann gar nicht im Standalone-Modus -> alte Version blieb haengen.
    //   - Jetzt: genau einmal pro BUILD. BUILD bei jedem Deploy hochzaehlen!
    (function () {
      var BUILD = '2026-08-10a';
      try {
        if (localStorage.getItem('hevjin_reset') === BUILD) return;
        // Marker ZUERST setzen -> kein Reload-Loop
        localStorage.setItem('hevjin_reset', BUILD);

        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          }));
        }
        if (jobs.length) {
          Promise.all(jobs).then(function () { location.reload(); })
                           .catch(function () { /* egal */ });
        }
      } catch (e) { /* Storage blockiert - dann eben kein Reset */ }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
