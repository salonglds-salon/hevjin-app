  <script>
    // OAuth Token Catcher for Supabase Flutter v2 on GitHub Pages
    (function() {
      var hash = window.location.hash;
      if (hash && hash.includes('access_token')) {
        var params = new URLSearchParams(hash.substring(1));
        var accessToken = params.get('access_token');
        var refreshToken = params.get('refresh_token');
        var expiresIn = params.get('expires_in');
        var tokenType = params.get('token_type');
        
        if (accessToken && refreshToken) {
          // Supabase Flutter v2 storage key format
          var key = 'sb-lrmoxfjuhqesjoxjkftw-auth-token';
          var expiresAt = Math.floor(Date.now() / 1000) + parseInt(expiresIn || '3600');
          
          // v2 stores a full session JSON
          var session = JSON.stringify({
            access_token: accessToken,
            refresh_token: refreshToken,
            expires_in: parseInt(expiresIn || '3600'),
            expires_at: expiresAt,
            token_type: tokenType || 'bearer'
          });
          
          window.localStorage.setItem(key, session);
          
          // Clean reload without hash
          window.location.href = window.location.origin + window.location.pathname;
          return; // Stop execution
        }
      }
    })();
  </script>
