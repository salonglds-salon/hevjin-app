  <script>
    // Cache-Reset EINMAL pro Build - auch in der PWA, aber garantiert nur einmal.
    //
    // Historie (nicht wieder kaputt machen):
    //   - Frueher lief das bei JEDEM Start -> SW+Cache weg -> App laedt alles
    //     neu -> Homescreen-App haengt.
    //   - Dann im Standalone-Modus GAR NICHT -> PWA behielt den alten Service
    //     Worker und servierte dauerhaft die alte Version.
    //   - Jetzt: genau einmal pro BUILD, danach einmal Reload, damit der frische
    //     Service Worker uebernimmt. BUILD bei jedem Deploy hochzaehlen!
    (function () {
      var BUILD = '2026-08-09b';
      try {
        if (localStorage.getItem('hevjin_reset') === BUILD) return;
        // Marker ZUERST setzen -> kein Reload-Loop, falls der Reload frueh greift
        localStorage.setItem('hevjin_reset', BUILD);

        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          }));
        }
        if (jobs.length) {
          Promise.all(jobs).then(function () { location.reload(); })
                           .catch(function () { /* egal */ });
        }
      } catch (e) { /* Storage blockiert - dann eben kein Reset */ }
    })();
  </script>
