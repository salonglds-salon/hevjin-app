  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hevjîn">

  <title>Hevjîn</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // OAuth Token Catcher - parse token from URL hash before Flutter loads
    (function() {
      var hash = window.location.hash;
      if (hash && hash.includes('access_token')) {
        var params = new URLSearchParams(hash.substring(1));
        var accessToken = params.get('access_token');
        var refreshToken = params.get('refresh_token');
        if (accessToken) {
          var storageKey = 'sb-lrmoxfjuhqesjoxjkftw-auth-token';
          var tokenData = {
            access_token: accessToken,
            refresh_token: refreshToken || '',
            token_type: params.get('token_type') || 'bearer',
            expires_in: parseInt(params.get('expires_in') || '3600'),
            expires_at: Math.floor(Date.now() / 1000) + parseInt(params.get('expires_in') || '3600'),
          };
          localStorage.setItem(storageKey, JSON.stringify(tokenData));
          window.history.replaceState(null, '', window.location.pathname);
        }
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
