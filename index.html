  <script>
    // Supabase OAuth Token Catcher for Flutter Web
    // Catches the #access_token from implicit flow and stores it
    // in the format SharedPreferencesLocalStorage expects
    (function() {
      var hash = window.location.hash;
      if (hash && hash.indexOf('access_token') !== -1) {
        var params = new URLSearchParams(hash.substring(1));
        var accessToken = params.get('access_token');
        var refreshToken = params.get('refresh_token');
        var expiresIn = params.get('expires_in');
        var tokenType = params.get('token_type');
        var expiresAt = Math.floor(Date.now() / 1000) + parseInt(expiresIn || '3600');
        
        if (accessToken && refreshToken) {
          // Flutter SharedPreferences uses "flutter." prefix on web
          var key = 'flutter.sb-lrmoxfjuhqesjoxjkftw-auth-token';
          var session = JSON.stringify({
            access_token: accessToken,
            refresh_token: refreshToken,
            expires_in: parseInt(expiresIn || '3600'),
            expires_at: expiresAt,
            token_type: tokenType || 'bearer'
          });
          window.localStorage.setItem(key, session);
          
          // Also set without flutter prefix (some versions use this)
          window.localStorage.setItem('sb-lrmoxfjuhqesjoxjkftw-auth-token', session);
          
          // Clean URL and reload
          window.location.replace(window.location.origin + window.location.pathname);
        }
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
